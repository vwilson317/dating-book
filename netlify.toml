[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# `netlify dev` serves the site and the functions in netlify/functions together on :8888.
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 4321
  port = 8888

# PostHog reverse proxy so ad blockers don't swallow analytics.
# EU cloud: change "us" to "eu" in both URLs below and ui_host in src/scripts/analytics.ts.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# PDFs stay downloadable but out of search results, so searchers land on the chapter pages
[[headers]]
  for = "/pdfs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Narration MP3s are linked with ?v=<content hash>, so each URL never changes
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
